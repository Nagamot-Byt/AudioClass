# ============================================================
# AudioClass Transcription Server - Docker Compose
#
# Uso rápido:
#   docker-compose -f docker-compose.server.yml up -d
#
# Con GPU (opcional, para faster-whisper):
#   docker-compose -f docker-compose.server.yml --profile gpu up -d
#
# Ver logs:
#   docker-compose -f docker-compose.server.yml logs -f
#
# Detener:
#   docker-compose -f docker-compose.server.yml down
# ============================================================

services:
  # ── Servidor de transcripción ─────────────────────────────
  audioclass:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: audioclass-server
    restart: unless-stopped
    ports:
      - "${AUDIOCLASS_PORT:-8000}:8000"
    environment:
      # Configuración del servidor
      - AUDIOCLASS_HOST=0.0.0.0
      - AUDIOCLASS_PORT=8000
      - AUDIOCLASS_API_KEY=${AUDIOCLASS_API_KEY:-}
      - AUDIOCLASS_MAX_UPLOAD_MB=${AUDIOCLASS_MAX_UPLOAD_MB:-200}
      - AUDIOCLASS_RATE_LIMIT=${AUDIOCLASS_RATE_LIMIT:-30}

      # Configuración de transcripción
      - AUDIOCLASS_MODEL=${AUDIOCLASS_MODEL:-base}
      - AUDIOCLASS_LANGUAGE=${AUDIOCLASS_LANGUAGE:-auto}
      - AUDIOCLASS_DEVICE=${AUDIOCLASS_DEVICE:-cpu}

      # Configuración de IA (opcional)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Configuración persistente
      - audioclass_config:/app/config
      # Grabaciones
      - audioclass_recordings:/app/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx reverse proxy (opcional) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: audioclass-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      audioclass:
        condition: service_healthy
    profiles:
      - proxy

  # ── Monitoreo con Prometheus (opcional) ────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: audioclass-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles:
      - monitoring

  # ── Dashboard con Grafana (opcional) ──────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: audioclass-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    profiles:
      - monitoring

volumes:
  audioclass_config:
    driver: local
  audioclass_recordings:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
