[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "audioclass"
version = "9.1.0"
description = "Aplicacion de escritorio para grabar, transcribir y exportar clases universitarias"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Daniel Perez"}
]
keywords = ["transcripcion", "audio", "whisper", "ia", "educacion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "customtkinter>=5.2",
    "fpdf2>=2.7",
    "pyaudio>=0.2.13",
    "sounddevice>=0.5.6",
    "faster-whisper>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]
whisper = [
    "openai-whisper>=20230918",
]

[project.urls]
Homepage = "https://github.com/Nagamot-Byt/AudioClass"
Repository = "https://github.com/Nagamot-Byt/AudioClass"
Issues = "https://github.com/Nagamot-Byt/AudioClass/issues"

[tool.setuptools.packages.find]
include = ["audioclass*", "config_manager*", "export_utils*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# ── Ruff (linter + formatter) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["."]
exclude = [
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "First Version",
    "Second Version",
    "3 Versión",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top (intentional: warnings.filterwarnings before imports)
    "E722",  # bare except (legacy codebase uses broad exception handling)
    "E731",  # lambda assignment (used in callbacks throughout UI code)
    "E741",  # ambiguous variable name (l, O, I)
    "F401",  # unused imports (some are re-exports or used by tests)
    "F841",  # local variable assigned but never used (common in stubs)
    "B008",  # do not perform function calls in argument defaults
    "B007",  # unused loop control variable
    "B023",  # function uses loop variable (intentional in closures)
    "B904",  # raise without from in except (many intentional bare raises)
    "B905",  # zip without explicit strict parameter
    "N801",  # class name should be CapWords (Qt convention varies)
    "N802",  # function name should be lowercase (some Qt callbacks)
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N814",  # camelcase import (e.g., import AudioCapture)
    "N818",  # exception name should end with Error (legacy naming)
    "UP007", # use X | Y for union types (not yet on 3.10+)
    "UP031", # use f-string instead of percent format (existing patterns)
    "RUF001",# ambiguous unicode character in string (intentional in Spanish text)
    "RUF002",# ambiguous unicode character in docstring (Spanish accents)
    "RUF005",# use unpacking instead of concatenation
    "RUF007",# pairwise unpacking instead of zip
    "RUF012",# mutable class variable annotation (dataclass patterns)
    "RUF013",# implicit Optional type annotation
    "RUF015",# unnecessary iterable allocation for first element
    "RUF034",# use contextlib.suppress instead of try/except/pass
    "RUF059",# unpacked variable never used (intentional in tuple unpacking)
]

[tool.ruff.lint.isort]
known-first-party = [
    "config_manager",
    "recording_engine",
    "template_plugins",
    "plugin_manager_ui",
    "waveform_widget",
    "config_dialog",
    "mic_optimizer_ui",
    "theme",
    "update_checker",
    "export_utils",
    "ai_providers",
    "transcription_engines",
    "audioclass_core",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
