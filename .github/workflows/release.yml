name: Release (exe + zips)

# Release multiplataforma: Windows + Linux + macOS.
# Se dispara con push de tag v* o manualmente.
# Cada plataforma compila su ejecutable, lo valida y sube el artifact.
# Un job final descarga los 3 artifacts y crea el GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── WINDOWS ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (incl. PyInstaller + faster-whisper)
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller

      - name: Modelos whisper y CT2
        shell: bash
        run: |
          python - <<'EOF'
          import os, shutil, whisper
          for name in ("tiny", "base"):
              whisper.load_model(name)
          os.makedirs("models", exist_ok=True)
          shutil.copy(os.path.expanduser("~/.cache/whisper/tiny.pt"), "models/tiny.pt")
          print("WHISPER_PT_READY")
          EOF
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          for name in ("tiny", "base"):
              snapshot_download(f"Systran/faster-whisper-{name}",
                                local_dir=f"models_ct2/{name}")
          print("CT2_READY")
          EOF
          ls -la models/tiny.pt models_ct2/tiny/model.bin models_ct2/base/model.bin

      - name: Despliegue completo (onefile + onedir + selftests + E2E + zips)
        shell: bash
        run: |
          bash desplegar_produccion.sh --with-onedir --skip-benchmark || {
            echo "::error::El despliegue fallo. Lineas de interes:"
            grep -E "FAIL|Error|Traceback|RESULTADO|falta asset|FALTA" despliegue.log 2>/dev/null \
              | tail -8 | sed 's/^/::error::/' || true
            exit 1
          }
        env:
          PYTHONUTF8: "1"

      - name: Subir artifacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-windows
          path: |
            AudioClass_v9.1_COMPLETA.zip
            AudioClass_v9.1_ONEDIR.zip
          if-no-files-found: error

  # ── LINUX ────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          # Instalar paquetes criticos primero, el resto con fallback
          sudo apt-get install -y -qq xvfb libportaudio2 libsndfile1 libglib2.0-0
          # OpenGL/EGL: nombres cambian entre versiones de Ubuntu
          sudo apt-get install -y -qq libgl1 2>/dev/null || \
            sudo apt-get install -y -qq libgl1-mesa-glx 2>/dev/null || true
          sudo apt-get install -y -qq libegl1-mesa 2>/dev/null || \
            sudo apt-get install -y -qq libegl1 2>/dev/null || true

      - name: Dependencias Python
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller

      - name: Modelos whisper y CT2
        shell: bash
        run: |
          python - <<'EOF'
          import os, shutil, whisper
          for name in ("tiny", "base"):
              whisper.load_model(name)
          os.makedirs("models", exist_ok=True)
          shutil.copy(os.path.expanduser("~/.cache/whisper/tiny.pt"), "models/tiny.pt")
          print("WHISPER_PT_READY")
          EOF
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          for name in ("tiny", "base"):
              snapshot_download(f"Systran/faster-whisper-{name}",
                                local_dir=f"models_ct2/{name}")
          print("CT2_READY")
          EOF
          ls -la models/tiny.pt models_ct2/tiny/model.bin models_ct2/base/model.bin

      - name: Tests del codigo fuente
        shell: bash
        run: |
          python -m py_compile audioclass_v91.py audioclass_core.py run_ci_suite.py
          xvfb-run -a python run_ci_suite.py --skip-benchmark
        env:
          PYTHONUTF8: "1"

      - name: Build onefile + onedir
        shell: bash
        run: |
          # onefile
          python -m PyInstaller --noconfirm --distpath dist_onefile AudioClass_v91_onefile.spec
          echo "=== onefile ==="
          ls -la dist_onefile/AudioClass
          # onedir
          python -m PyInstaller --noconfirm AudioClass_v91.spec
          echo "=== onedir ==="
          ls -la dist/AudioClass/AudioClass

      - name: Selftest transcripcion
        shell: bash
        run: |
          chmod +x dist_onefile/AudioClass
          timeout 180 xvfb-run -a dist_onefile/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
          echo "Selftest exit: $?"

      - name: Empaquetar zips Linux
        shell: bash
        run: |
          # onefile zip
          zip -j AudioClass_v9.1_LINUX.zip dist_onefile/AudioClass \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt \
            TERCEROS_Y_LICENCIAS.md
          # onedir zip
          (cd dist && zip -r ../AudioClass_v9.1_LINUX_ONEDIR.zip AudioClass/)
          zip -j AudioClass_v9.1_LINUX_ONEDIR.zip \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt \
            TERCEROS_Y_LICENCIAS.md
          ls -la AudioClass_v9.1_LINUX*.zip

      - name: Subir artifacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-linux
          path: |
            AudioClass_v9.1_LINUX.zip
            AudioClass_v9.1_LINUX_ONEDIR.zip
          if-no-files-found: error

  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        run: |
          brew install portaudio

      - name: Dependencias Python
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller

      - name: Modelos whisper y CT2
        shell: bash
        run: |
          python - <<'EOF'
          import os, shutil, whisper
          for name in ("tiny", "base"):
              whisper.load_model(name)
          os.makedirs("models", exist_ok=True)
          shutil.copy(os.path.expanduser("~/.cache/whisper/tiny.pt"), "models/tiny.pt")
          print("WHISPER_PT_READY")
          EOF
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          for name in ("tiny", "base"):
              snapshot_download(f"Systran/faster-whisper-{name}",
                                local_dir=f"models_ct2/{name}")
          print("CT2_READY")
          EOF
          ls -la models/tiny.pt models_ct2/tiny/model.bin models_ct2/base/model.bin

      - name: Build onefile + onedir
        shell: bash
        run: |
          # onefile
          python -m PyInstaller --noconfirm --distpath dist_onefile AudioClass_v91_onefile.spec
          echo "=== onefile ==="
          ls -la dist_onefile/AudioClass
          # onedir
          python -m PyInstaller --noconfirm AudioClass_v91.spec
          echo "=== onedir ==="
          ls -la dist/AudioClass/AudioClass

      - name: Selftest transcripcion
        shell: bash
        run: |
          chmod +x dist_onefile/AudioClass
          # macOS no tiene 'timeout' (GNU). Usar background + kill como fallback.
          dist_onefile/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt &
          SELFTEST_PID=$!
          for i in $(seq 1 36); do
            sleep 5
            if ! kill -0 $SELFTEST_PID 2>/dev/null; then break; fi
          done
          kill $SELFTEST_PID 2>/dev/null || true
          wait $SELFTEST_PID 2>/dev/null || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
          echo "Selftest done (pid=$SELFTEST_PID)"

      - name: Empaquetar zips macOS
        shell: bash
        run: |
          # onefile zip
          zip -j AudioClass_v9.1_MACOS.zip dist_onefile/AudioClass \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt \
            TERCEROS_Y_LICENCIAS.md
          # onedir zip
          (cd dist && zip -r ../AudioClass_v9.1_MACOS_ONEDIR.zip AudioClass/)
          zip -j AudioClass_v9.1_MACOS_ONEDIR.zip \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt \
            TERCEROS_Y_LICENCIAS.md
          ls -la AudioClass_v9.1_MACOS*.zip

      - name: Subir artifacts macOS
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-macos
          path: |
            AudioClass_v9.1_MACOS.zip
            AudioClass_v9.1_MACOS_ONEDIR.zip
          if-no-files-found: error

  # ── PUBLICAR RELEASE ─────────────────────────────────────────────────────
  publish-release:
    name: Publicar Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download todos los artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Listar artifacts descargados
        run: find artifacts/ -type f -name "*.zip" -exec ls -lh {} \;

      - name: Borrar Release previo si existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Crear GitHub Release con las 3 plataformas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copiar solo zips onefile (onedir ~600MB c/u, total excede limites)
          mkdir -p release_assets
          find artifacts/ -type f -name '*.zip' | grep -iv onedir | while read f; do
            cp "$f" release_assets/
          done
          echo '=== Zips onefile ==='
          ls -lh release_assets/

          # Crear release vacio primero
          gh release create "${{ github.ref_name }}" \
            --title "AudioClass ${{ github.ref_name }} (Multi-Plataforma)" \
            --notes-file NOTA_RELEASE.md

          # Subir zips y docs uno a uno (evita timeout con archivos grandes)
          for f in release_assets/*.zip; do
            echo "Subiendo $f..."
            gh release upload "${{ github.ref_name }}" "$f"
          done
          for f in EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md; do
            gh release upload "${{ github.ref_name }}" "$f"
          done
          echo '=== Release actualizado ==='
          gh release view "${{ github.ref_name }}" --json assets | python -c "import sys,json; d=json.load(sys.stdin); [print(f'  {a[\"name\"]}: {a[\"size\"]/(1024*1024):.1f} MB') for a in d['assets']]"
