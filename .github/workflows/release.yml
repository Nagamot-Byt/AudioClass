name: Release (exe + zips)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -- WINDOWS --
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        shell: bash
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Despliegue completo
        shell: bash
        run: bash desplegar_produccion.sh --with-onedir --skip-benchmark
        env:
          PYTHONUTF8: "1"
      - name: Subir artifacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-windows
          path: AudioClass_v9.1_COMPLETA.zip
          if-no-files-found: error

  # -- LINUX (onedir, split into <1GB parts) --
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libportaudio2 libsndfile1 libglib2.0-0 bc
          sudo apt-get install -y -qq libgl1 2>/dev/null || sudo apt-get install -y -qq libgl1-mesa-glx 2>/dev/null || true
          sudo apt-get install -y -qq libegl1-mesa 2>/dev/null || sudo apt-get install -y -qq libegl1 2>/dev/null || true
      - name: Dependencias Python
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Build onedir (Linux-optimized)
        run: |
          python -m PyInstaller --noconfirm AudioClass_v91_linux.spec
          ls -la dist/AudioClass/
          du -sh dist/AudioClass/
      - name: Selftest transcripcion
        run: |
          chmod +x dist/AudioClass/AudioClass
          timeout 180 xvfb-run -a dist/AudioClass/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
      - name: Empaquetar tar.xz Linux (split <1GB parts)
        run: |
          tar -cJf AudioClass_v9.1_LINUX.tar.xz \
            -C dist AudioClass \
            -C "$GITHUB_WORKSPACE" LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
          FULL_SIZE=$(stat --printf='%s' AudioClass_v9.1_LINUX.tar.xz)
          echo "Full tar.xz: $FULL_SIZE bytes ($(echo "$FULL_SIZE / 1048576" | bc)MB)"
          # GitHub limit is 2GB per asset. Split if >1GB.
          THRESHOLD=1073741824
          if [ "$FULL_SIZE" -gt "$THRESHOLD" ]; then
            echo "Splitting into 1GB parts..."
            split -b 1073741824 -d AudioClass_v9.1_LINUX.tar.xz AudioClass_v9.1_LINUX_part_
            ls -lh AudioClass_v9.1_LINUX_part_*
            echo "PARTS=1"
          else
            echo "No split needed (<1GB)"
            echo "PARTS=0"
          fi
      - name: Subir artifacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-linux
          path: |
            AudioClass_v9.1_LINUX.tar.xz
            AudioClass_v9.1_LINUX_part_*
          if-no-files-found: error

  # -- macOS --
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: brew install portaudio
      - name: Dependencias Python
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Build onefile
        run: |
          python -m PyInstaller --noconfirm --distpath dist_onefile AudioClass_v91_onefile.spec
          ls -la dist_onefile/AudioClass
      - name: Selftest transcripcion
        run: |
          chmod +x dist_onefile/AudioClass
          dist_onefile/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt &
          PID=$!; for i in $(seq 1 36); do sleep 5; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
      - name: Empaquetar zip macOS
        run: |
          zip -j AudioClass_v9.1_MACOS.zip dist_onefile/AudioClass \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
          ls -lh AudioClass_v9.1_MACOS.zip
      - name: Subir artifacts macOS
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-macos
          path: AudioClass_v9.1_MACOS.zip
          if-no-files-found: error

  # -- PUBLICAR RELEASE --
  publish-release:
    name: Publicar Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Listar artifacts
        run: |
          echo "=== Disk ==="
          df -h /
          echo "=== All files ==="
          find artifacts/ -type f -exec ls -lh {} \;
      - name: Delete existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" --yes
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "AudioClass ${{ github.ref_name }}" \
            --notes-file NOTA_RELEASE.md
      - name: Upload docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --clobber \
            EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md NOTA_RELEASE.md
      - name: Upload Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(find artifacts/ -name 'AudioClass_v9.1_COMPLETA.zip' | head -1)
          echo "Uploading $ZIP ($(du -h "$ZIP" | cut -f1))"
          gh release upload "${{ github.ref_name }}" "$ZIP" --clobber
      - name: Upload Linux (tar.xz or split parts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          # Check if split parts exist
          PARTS=$(find artifacts/ -name 'AudioClass_v9.1_LINUX_part_*' | sort)
          if [ -n "$PARTS" ]; then
            echo "Uploading split parts:"
            echo "$PARTS"
            UPLOADED=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt..."
              gh release upload "${{ github.ref_name }}" $PARTS --clobber && UPLOADED=1 && echo "SUCCESS on attempt $attempt" && break
              echo "Attempt $attempt FAILED, waiting 15s..."
              sleep 15
            done
            if [ "$UPLOADED" != "1" ]; then
              echo "ERROR: All upload attempts failed for Linux parts"
              exit 1
            fi
          else
            # Single tar.xz file
            FILE=$(find artifacts/ -name 'AudioClass_v9.1_LINUX.tar.xz' | head -1)
            echo "Uploading $FILE ($(du -h "$FILE" | cut -f1))"
            UPLOADED=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt..."
              gh release upload "${{ github.ref_name }}" "$FILE" --clobber && UPLOADED=1 && echo "SUCCESS on attempt $attempt" && break
              echo "Attempt $attempt FAILED, waiting 15s..."
              sleep 15
            done
            if [ "$UPLOADED" != "1" ]; then
              echo "ERROR: All upload attempts failed for Linux tar.xz"
              exit 1
            fi
          fi
      - name: Upload macOS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ZIP=$(find artifacts/ -name 'AudioClass_v9.1_MACOS.zip' | head -1)
          echo "Uploading $ZIP ($(du -h "$ZIP" | cut -f1))"
          UPLOADED=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            gh release upload "${{ github.ref_name }}" "$ZIP" --clobber && UPLOADED=1 && echo "SUCCESS on attempt $attempt" && break
            echo "Attempt $attempt FAILED, waiting 15s..."
            sleep 15
          done
          if [ "$UPLOADED" != "1" ]; then
            echo "ERROR: All upload attempts failed for macOS ZIP"
            exit 1
          fi
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Release info ==="
          gh release view "${{ github.ref_name }}"
          echo "=== Assets ==="
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[] | "\(.name) \(.size/1048576|floor)MB"'
