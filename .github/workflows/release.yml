name: Release (exe + zips)

# #11 — Post-producción automática (el equivalente desktop de "push -> deploy").
# Al pushear un tag v* (p. ej. `git tag v9.1 && git push --tags`) este workflow:
#   1. Compila los DOS ejecutables (onefile + onedir) con PyInstaller en un
#      runner Windows, igual que desplegar_produccion.sh local.
#   2. Corre los selftests reales (--selftest-transcribe), el E2E de UI headless
#      (--e2e-ui wizard/config/widgets) y el WCAG empaquetado.
#   3. Genera los zips con los documentos legales dentro (EULA, privacidad, ...).
#   4. Crea un GitHub Release con todo adjunto -> rollback = desplegar un tag
#      anterior (los releases son inmutables y versionados por tag).
# Disparo manual (workflow_dispatch): compila y valida sin crear release; los
# entregables quedan como artifacts del run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# gh release create necesita escribir contents (el GITHUB_TOKEN por defecto de
# repos nuevos es read-only: el paso de release fallaba con 403 tras un build
# correcto). El resto del workflow solo lee el repo.
permissions:
  contents: write

jobs:
  build:
    name: Compilar y publicar AudioClass ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (incl. PyInstaller + faster-whisper)
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller

      - name: Modelos whisper y CT2 (los que exige el preflight del despliegue)
        shell: bash
        run: |
          # openai-whisper .pt (base + tiny) a la cache y models/tiny.pt al repo
          python - <<'EOF'
          import os, shutil, whisper
          for name in ("tiny", "base"):
              whisper.load_model(name)
          os.makedirs("models", exist_ok=True)
          shutil.copy(os.path.expanduser("~/.cache/whisper/tiny.pt"), "models/tiny.pt")
          print("WHISPER_PT_READY")
          EOF
          # faster-whisper CT2 (model.bin + tokenizer) en el layout del bundle
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          for name in ("tiny", "base"):
              snapshot_download(f"Systran/faster-whisper-{name}",
                                local_dir=f"models_ct2/{name}")
          print("CT2_READY")
          EOF
          ls -la models/tiny.pt models_ct2/tiny/model.bin models_ct2/base/model.bin

      - name: Despliegue completo (onefile + onedir + selftests + WCAG + zips)
        shell: bash
        run: |
          bash desplegar_produccion.sh --with-onedir --skip-benchmark || {
            # Solo las lineas de interes (FAIL/Error/Traceback/resumen) como
            # ::error::: GitHub limita las annotations por paso (~10), asi
            # que un tail completo se truncaria en el encabezado del log.
            echo "::error::El despliegue fallo. Lineas de interes de despliegue.log:"
            grep -E "FAIL|Error|Traceback|RESULTADO|falta asset|FALTA" despliegue.log 2>/dev/null \
              | tail -8 | sed 's/^/::error::/' || true
            exit 1
          }
        env:
          PYTHONUTF8: "1"

      - name: Subir entregables como artifacts (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-entregables
          path: |
            AudioClass_v9.1_COMPLETA.zip
            AudioClass_v9.1_ONEDIR.zip
            EULA.txt
            AVISO_DE_PRIVACIDAD.txt
            TERCEROS_Y_LICENCIAS.md
          if-no-files-found: error

      - name: Borrar Release previo si existe (force-push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cuando se fuerza un tag (git push --force origin v9.1-final), el
          # Release viejo sigue existiendo y gh release create falla con
          # "a release with the same tag name already exists". Borramos el
          # Release previo (sin borrar el tag del repo) antes de recrearlo.
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Crear GitHub Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Las notas del Release vienen de NOTA_RELEASE.md (versionada en el
          # repo): un solo cuerpo profesional y editable por PR, en vez de
          # notas por defecto inline. gh lee el archivo como UTF-8.
          if ! gh release create "${{ github.ref_name }}" \
            AudioClass_v9.1_COMPLETA.zip AudioClass_v9.1_ONEDIR.zip \
            EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md \
            --title "AudioClass ${{ github.ref_name }}" \
            --notes-file NOTA_RELEASE.md 2>&1 | tee /tmp/ghrel.log; then
            # El motivo del fallo queda como annotation del paso (los logs
            # completos requieren permisos de admin para descargarse).
            echo "::error::gh release create fallo:"
            sed 's/^/::error::/' /tmp/ghrel.log | tail -12
            exit 1
          fi
