name: Release (exe + zips)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -- WINDOWS --
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        shell: bash
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Despliegue completo
        shell: bash
        run: bash desplegar_produccion.sh --with-onedir --skip-benchmark
        env:
          PYTHONUTF8: "1"
      - name: Subir artifacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-windows
          path: AudioClass_v9.1_COMPLETA.zip
          if-no-files-found: error

  # -- LINUX --
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libportaudio2 libsndfile1 libglib2.0-0
          sudo apt-get install -y -qq libgl1 2>/dev/null || sudo apt-get install -y -qq libgl1-mesa-glx 2>/dev/null || true
          sudo apt-get install -y -qq libegl1-mesa 2>/dev/null || sudo apt-get install -y -qq libegl1 2>/dev/null || true
      - name: Dependencias Python
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Build onefile
        run: |
          python -m PyInstaller --noconfirm --distpath dist_onefile AudioClass_v91_onefile.spec
          ls -la dist_onefile/AudioClass
      - name: Selftest transcripcion
        run: |
          chmod +x dist_onefile/AudioClass
          timeout 180 xvfb-run -a dist_onefile/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
      - name: Empaquetar zip Linux
        run: |
          zip -j AudioClass_v9.1_LINUX.zip dist_onefile/AudioClass \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
          ls -lh AudioClass_v9.1_LINUX.zip
      - name: Subir artifacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-linux
          path: AudioClass_v9.1_LINUX.zip
          if-no-files-found: error

  # -- macOS --
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: brew install portaudio
      - name: Dependencias Python
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Build onefile
        run: |
          python -m PyInstaller --noconfirm --distpath dist_onefile AudioClass_v91_onefile.spec
          ls -la dist_onefile/AudioClass
      - name: Selftest transcripcion
        run: |
          chmod +x dist_onefile/AudioClass
          dist_onefile/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt &
          PID=$!; for i in $(seq 1 36); do sleep 5; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
      - name: Empaquetar zip macOS
        run: |
          zip -j AudioClass_v9.1_MACOS.zip dist_onefile/AudioClass \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
          ls -lh AudioClass_v9.1_MACOS.zip
      - name: Subir artifacts macOS
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-macos
          path: AudioClass_v9.1_MACOS.zip
          if-no-files-found: error

  # -- PUBLICAR RELEASE --
  publish-release:
    name: Publicar Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Listar artifacts descargados
        run: |
          echo "=== Disk ==="
          df -h /
          echo "=== All files ==="
          find artifacts/ -type f -exec ls -lh {} \;
      - name: Crear Release (si no existe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "AudioClass $TAG" \
              --notes-file NOTA_RELEASE.md
          else
            gh release edit "$TAG" \
              --title "AudioClass $TAG" \
              --notes-file NOTA_RELEASE.md
          fi
      - name: Subir todos los assets via Python
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 << 'PYEOF'
          import os, sys, json, time
          import urllib.request, urllib.error, ssl

          token = os.environ["GH_TOKEN"]
          tag = os.environ["GITHUB_REF_NAME"]
          repo = "Nagamot-Byt/AudioClass"

          # --- helpers ---
          class NoTimeoutHTTPAdapter:
              """Custom opener with long timeout for large uploads."""
              pass

          def api(method, url, data=None, timeout=120):
              hdrs = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              }
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, headers=hdrs, data=body, method=method)
              return urllib.request.urlopen(req, timeout=timeout)

          # 1. Find release
          resp = json.loads(api("GET", f"https://api.github.com/repos/{repo}/releases/tags/{tag}").read())
          release_id = resp["id"]
          upload_base = resp["upload_url"].split("{")[0]
          existing = {a["name"] for a in resp.get("assets", [])}
          print(f"Release {tag} (id={release_id}), existing assets: {existing}")

          # 2. Collect files
          import glob as g
          files = []
          # Docs first (quick smoke test)
          for doc in ["EULA.txt", "AVISO_DE_PRIVACIDAD.txt", "TERCEROS_Y_LICENCIAS.md", "NOTA_RELEASE.md"]:
              if os.path.exists(doc):
                  files.append(doc)
          # Zips
          for pattern in ["AudioClass_v9.1_COMPLETA.zip", "AudioClass_v9.1_LINUX.zip", "AudioClass_v9.1_MACOS.zip"]:
              matches = g.glob(f"artifacts/**/{pattern}", recursive=True)
              if matches:
                  files.append(matches[0])

          if not files:
              print("No files to upload")
              sys.exit(0)

          # 3. Upload each with retry (streaming, 5 min timeout per file)
          failed = []
          for filepath in files:
              fname = os.path.basename(filepath)
              size_mb = os.path.getsize(filepath) / (1024 * 1024)
              print(f"\n--- {fname} ({size_mb:.1f} MB) ---")

              if fname in existing:
                  print(f"  Skipping (already uploaded)")
                  continue

              url = f"{upload_base}?name={fname}"
              for attempt in range(3):
                  try:
                      # Stream upload in chunks
                      with open(filepath, "rb") as f:
                          data = f.read()
                      req = urllib.request.Request(
                          url, data=data, method="POST",
                          headers={
                              "Authorization": f"Bearer {token}",
                              "Accept": "application/vnd.github+json",
                              "Content-Type": "application/octet-stream",
                          }
                      )
                      # Use a very long timeout for large files
                      resp = urllib.request.urlopen(req, timeout=600)
                      result = json.loads(resp.read())
                      print(f"  OK (attempt {attempt+1}, id={result.get('id', '?')})")
                      break
                  except Exception as e:
                      print(f"  Attempt {attempt+1} failed: {e}")
                      if attempt < 2:
                          time.sleep(10)
                      else:
                          failed.append(fname)

          # 4. Report
          print(f"\n=== RESULT: {len(files)-len(failed)}/{len(files)} uploaded ===")
          if failed:
              print(f"FAILED: {failed}")
              sys.exit(1)
          print("All assets uploaded successfully!")
          PYEOF
      - name: Verificar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}"
