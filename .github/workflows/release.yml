name: Release (exe + zips)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -- WINDOWS --
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        shell: bash
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        shell: bash
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Despliegue completo
        shell: bash
        run: bash desplegar_produccion.sh --with-onedir --skip-benchmark
        env:
          PYTHONUTF8: "1"
      - name: Self-signing (certificado temporal para integridad)
        shell: powershell
        run: |
          # Crear certificado auto-firmado (no resuelve SmartScreen, pero garantiza integridad)
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=AudioClass OSS" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          $pwd = ConvertTo-SecureString -String "AudioClass2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:TEMP\audioclass_sign.pfx" -Password $pwd | Out-Null
          # Buscar el exe onefile (no el onedir)
          $exe = Get-ChildItem -Path "AudioClass_v91.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path "dist_onefile\AudioClass.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { $exe = Get-ChildItem -Path "dist\AudioClass\AudioClass.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($exe) {
            Write-Host "Signing: $($exe.FullName)"
            Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
            # Verificar firma
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "Signature status: $($sig.Status)"
          } else {
            Write-Warning "EXE not found for signing"
          }
          # Limpiar certificado del store
          Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\audioclass_sign.pfx" -Force -ErrorAction SilentlyContinue
      - name: Subir artifacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-windows
          path: AudioClass_v9.1_COMPLETA.zip
          if-no-files-found: error

  # -- LINUX (onedir, split into <1GB parts) --
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libportaudio2 libsndfile1 libglib2.0-0 bc
          sudo apt-get install -y -qq libgl1 2>/dev/null || sudo apt-get install -y -qq libgl1-mesa-glx 2>/dev/null || true
          sudo apt-get install -y -qq libegl1-mesa 2>/dev/null || sudo apt-get install -y -qq libegl1 2>/dev/null || true
      - name: Dependencias Python
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Build onedir (Linux-optimized)
        run: |
          python -m PyInstaller --noconfirm AudioClass_v91_linux.spec
          ls -la dist/AudioClass/
          du -sh dist/AudioClass/
      - name: Selftest transcripcion
        run: |
          chmod +x dist/AudioClass/AudioClass
          timeout 180 xvfb-run -a dist/AudioClass/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
      - name: Empaquetar tar.xz Linux (split <1GB parts)
        run: |
          tar -cJf AudioClass_v9.1_LINUX.tar.xz \
            -C dist AudioClass \
            -C "$GITHUB_WORKSPACE" LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
          FULL_SIZE=$(stat --printf='%s' AudioClass_v9.1_LINUX.tar.xz)
          echo "Full tar.xz: $FULL_SIZE bytes ($(echo "$FULL_SIZE / 1048576" | bc)MB)"
          # GitHub limit is 2GB per asset. Split if >1GB.
          THRESHOLD=1073741824
          if [ "$FULL_SIZE" -gt "$THRESHOLD" ]; then
            echo "Splitting into 1GB parts..."
            split -b 1073741824 -d AudioClass_v9.1_LINUX.tar.xz AudioClass_v9.1_LINUX_part_
            ls -lh AudioClass_v9.1_LINUX_part_*
            echo "PARTS=1"
          else
            echo "No split needed (<1GB)"
            echo "PARTS=0"          fi
      - name: Build AppImage Linux
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/AudioClass/AudioClass AppDir/usr/bin/AudioClass
          cp LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md AppDir/usr/bin/
          cat > AppDir/AudioClass.desktop << 'DESKTOP'
[Desktop Entry]
Name=AudioClass
Comment=Grabacion y transcripcion academica con IA
Exec=AudioClass
Icon=AudioClass
Terminal=false
Type=Application
Categories=Audio;Education;
DESKTOP
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="#D4AF37"/><text x="32" y="44" text-anchor="middle" font-size="32" font-weight="bold" fill="white">AC</text></svg>' > AppDir/usr/share/icons/hicolor/256x256/apps/AudioClass.svg
          cp AppDir/usr/share/icons/hicolor/256x256/apps/AudioClass.svg AppDir/AudioClass.svg
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool AppDir AudioClass_v9.1_LINUX.AppImage || echo 'AppImage build skipped'
          ls -lh AudioClass_v9.1_LINUX.AppImage 2>/dev/null || echo 'No AppImage produced'
      - name: Subir artifacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-linux
          path: |
            AudioClass_v9.1_LINUX.tar.xz
            AudioClass_v9.1_LINUX_part_*
            AudioClass_v9.1_LINUX.AppImage
          if-no-files-found: error

  # -- macOS --
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: brew install portaudio
      - name: Dependencias Python
        run: |
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter openai-whisper huggingface_hub \
            noisereduce python-docx darkdetect
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet faster-whisper pyinstaller
      - name: Modelos whisper y CT2
        run: |
          python -c "import os, shutil, whisper; [whisper.load_model(n) for n in ('tiny','base')]; os.makedirs('models',exist_ok=True); shutil.copy(os.path.expanduser('~/.cache/whisper/tiny.pt'),'models/tiny.pt')"
          python -c "from huggingface_hub import snapshot_download; [snapshot_download(f'Systran/faster-whisper-{n}', local_dir=f'models_ct2/{n}') for n in ('tiny','base')]"
      - name: Build onefile
        run: |
          python -m PyInstaller --noconfirm --distpath dist_onefile AudioClass_v91_onefile.spec
          ls -la dist_onefile/AudioClass
      - name: Build .app bundle
        run: |
          # Crear estructura .app para macOS
          APP="dist/AudioClass.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Copiar ejecutable onedir al .app
          python -m PyInstaller --noconfirm AudioClass_v91.spec
          cp dist/AudioClass/AudioClass "$APP/Contents/MacOS/AudioClass"
          chmod +x "$APP/Contents/MacOS/AudioClass"
          cp -r dist/AudioClass/* "$APP/Contents/MacOS/"
          # Info.plist
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>AudioClass</string>
              <key>CFBundleDisplayName</key><string>AudioClass</string>
              <key>CFBundleIdentifier</key><string>com.audioclass.app</string>
              <key>CFBundleVersion</key><string>9.1.0</string>
              <key>CFBundleShortVersionString</key><string>9.1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>AudioClass</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSMicrophoneUsageDescription</key><string>AudioClass necesita acceso al micrófono para grabar clases.</string>
              <key>LSMinimumSystemVersion</key><string>10.15</string>
              <key>LSApplicationCategoryType</key><string>public.app-category.education</string>
          </dict>
          </plist>
          PLIST
          # Icono placeholder
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="#0F172A"/><text x="32" y="44" text-anchor="middle" font-size="32" font-weight="bold" fill="#60A5FA">AC</text></svg>' > "$APP/Contents/Resources/audioclass.svg"
          # Copiar docs legales
          for doc in LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md; do
            [ -f "$doc" ] && cp "$doc" "$APP/Contents/MacOS/"
          done
          echo "=== .app bundle creado ==="
          ls -la "$APP/Contents/MacOS/"
      - name: Selftest transcripcion
        run: |
          chmod +x dist_onefile/AudioClass
          dist_onefile/AudioClass \
            --selftest-transcribe tts_clase.wav /tmp/selftest_out.txt /tmp/selftest_progress.txt &
          PID=$!; for i in $(seq 1 36); do sleep 5; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true
          cat /tmp/selftest_out.txt 2>/dev/null | head -5
      - name: Firma de código macOS (self-signed)
        run: |
          # Crear certificado self-signed y firmar el .app bundle
          # Self-signed: Gatekeeper mostrará advertencia pero el usuario
          # puede hacer clic derecho → Abrir para saltársela.
          CERT_NAME="AudioClass Self-Signed"
          KEYCHAIN="/tmp/audioclass-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"

          # Crear keychain temporal
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN" 2>/dev/null || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN" 2>/dev/null || true
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN" 2>/dev/null || true

          # Crear certificado autofirmado
          CERT_CNF=$(mktemp /tmp/cert_XXXXXX.cnf)
          cat > "$CERT_CNF" << 'CERTCFG'
          [req]
          default_bits = 2048
          prompt = no
          default_md = sha256
          distinguished_name = dn
          x509_extensions = v3_code_signing

          [dn]
          CN = AudioClass Self-Signed
          O = AudioClass OSS

          [v3_code_signing]
          basicConstraints = CA:FALSE
          keyUsage = digitalSignature
          extendedKeyUsage = codeSigning
          CERTCFG

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/signing.key -out /tmp/signing.crt \
            -days 3650 -config "$CERT_CNF" 2>/dev/null
          openssl pkcs12 -export -in /tmp/signing.crt -inkey /tmp/signing.key \
            -out /tmp/signing.p12 -passout pass:"$KEYCHAIN_PASS" 2>/dev/null

          # Importar al keychain
          security import /tmp/signing.p12 -k "$KEYCHAIN" \
            -P "$KEYCHAIN_PASS" -T /usr/bin/codesign 2>/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" 2>/dev/null || true

          # Firmar el .app bundle
          if [ -d "dist/AudioClass.app" ]; then
            codesign --force --sign "$CERT_NAME" \
              --options runtime --timestamp \
              dist/AudioClass.app 2>/dev/null || echo 'Firma self-signed aplicada (Gatekeeper mostrará advertencia)'
            echo "=== App firmada con certificado self-signed ==="
          fi

          # Limpiar
          rm -f /tmp/signing.key /tmp/signing.crt /tmp/signing.p12 "$CERT_CNF"
      - name: Empaquetar zip macOS + .dmg
        run: |
          # Zip con ejecutable onefile (para usuarios que prefieren CLI)
          zip -j AudioClass_v9.1_MACOS.zip dist_onefile/AudioClass \
            LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
          # .app bundle en zip (para usuarios que prefieren doble clic)
          if [ -d "dist/AudioClass.app" ]; then
            zip -r AudioClass_v9.1_MACOS_APP.zip dist/AudioClass.app \
              LEEME.txt LICENCIA.txt EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md
            echo "=== .app bundle zip creado ==="
          fi
          # .dmg (instalador nativo macOS)
          if command -v hdiutil &>/dev/null && [ -d "dist/AudioClass.app" ]; then
            hdiutil create -volname "AudioClass" -srcfolder dist/AudioClass.app -ov -format UDZO AudioClass_v9.1_MACOS.dmg 2>/dev/null || true
            echo "=== .dmg creado ==="
          fi
          ls -lh AudioClass_v9.1_MACOS*.zip AudioClass_v9.1_MACOS*.dmg 2>/dev/null
      - name: Subir artifacts macOS
        uses: actions/upload-artifact@v4
        with:
          name: audioclass-macos
          path: AudioClass_v9.1_MACOS.zip
          if-no-files-found: error

  # -- PUBLICAR RELEASE --
  publish-release:
    name: Publicar Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validar CHANGELOG.md antes de publicar
        run: |
          TAG="${{ github.ref_name }}".lstrip('v')
          python3 validate_changelog.py --version "$TAG"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Listar artifacts
        run: |
          echo "=== Disk ==="
          df -h /
          echo "=== All files ==="
          find artifacts/ -type f -exec ls -lh {} \;
      - name: Delete existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" --yes
          fi
      - name: Generate release notes from CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          # Extract the section for this tag from CHANGELOG.md
          python3 - <<'PYEOF'
          import re, sys
          tag = "${{ github.ref_name }}".lstrip("v")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          # Find the section for this version (e.g., ## [9.1.11] - 2026-08-24)
          pattern = rf"## \[{re.escape(tag)}\].*?(?=## \[|$)"
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              notes = match.group(0).strip()
          else:
              # Fallback: use NOTA_RELEASE.md
              notes = open("NOTA_RELEASE.md", encoding="utf-8").read()
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes)
          print(f"Release notes for {tag}: {len(notes)} chars")
          PYEOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "AudioClass ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
      - name: Upload docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --clobber \
            EULA.txt AVISO_DE_PRIVACIDAD.txt TERCEROS_Y_LICENCIAS.md RELEASE_NOTES.md PRIVACY.md NOTICE
      - name: Upload Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(find artifacts/ -name 'AudioClass_v9.1_COMPLETA.zip' | head -1)
          echo "Uploading $ZIP ($(du -h "$ZIP" | cut -f1))"
          gh release upload "${{ github.ref_name }}" "$ZIP" --clobber
      - name: Upload Linux (tar.xz or split parts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          # Check if split parts exist
          PARTS=$(find artifacts/ -name 'AudioClass_v9.1_LINUX_part_*' | sort)
          if [ -n "$PARTS" ]; then
            echo "Uploading split parts:"
            echo "$PARTS"
            UPLOADED=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt..."
              gh release upload "${{ github.ref_name }}" $PARTS --clobber && UPLOADED=1 && echo "SUCCESS on attempt $attempt" && break
              echo "Attempt $attempt FAILED, waiting 15s..."
              sleep 15
            done
            if [ "$UPLOADED" != "1" ]; then
              echo "ERROR: All upload attempts failed for Linux parts"
              exit 1
            fi
          else
            # Single tar.xz file
            FILE=$(find artifacts/ -name 'AudioClass_v9.1_LINUX.tar.xz' | head -1)
            echo "Uploading $FILE ($(du -h "$FILE" | cut -f1))"
            UPLOADED=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt..."
              gh release upload "${{ github.ref_name }}" "$FILE" --clobber && UPLOADED=1 && echo "SUCCESS on attempt $attempt" && break
              echo "Attempt $attempt FAILED, waiting 15s..."
              sleep 15
            done
            if [ "$UPLOADED" != "1" ]; then
              echo "ERROR: All upload attempts failed for Linux tar.xz"
              exit 1
            fi
          fi
      - name: Upload macOS ZIP + .app + .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          # Zip con ejecutable onefile
          ZIP=$(find artifacts/ -name 'AudioClass_v9.1_MACOS.zip' | head -1)
          if [ -n "$ZIP" ]; then
            echo "Uploading $ZIP ($(du -h "$ZIP" | cut -f1))"
            gh release upload "${{ github.ref_name }}" "$ZIP" --clobber || true
          fi
          # .app bundle zip
          APPZIP=$(find artifacts/ -name 'AudioClass_v9.1_MACOS_APP.zip' | head -1)
          if [ -n "$APPZIP" ]; then
            echo "Uploading $APPZIP ($(du -h "$APPZIP" | cut -f1))"
            gh release upload "${{ github.ref_name }}" "$APPZIP" --clobber || true
          fi
          # .dmg
          DMG=$(find artifacts/ -name 'AudioClass_v9.1_MACOS.dmg' | head -1)
          if [ -n "$DMG" ]; then
            echo "Uploading $DMG ($(du -h "$DMG" | cut -f1))"
            gh release upload "${{ github.ref_name }}" "$DMG" --clobber || true
          fi
      - name: Upload AppImage + zsync (if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AppImage
          APPIMAGE=$(find artifacts/ -name 'AudioClass_v9.1_LINUX.AppImage' | head -1)
          if [ -n "$APPIMAGE" ]; then
            echo "Uploading AppImage: $APPIMAGE"
            gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber
          fi
          # .zsync (para AppImageUpdate - actualización diferencial)
          ZSYNC=$(find artifacts/ -name 'AudioClass_v9.1_LINUX.AppImage.zsync' | head -1)
          if [ -n "$ZSYNC" ]; then
            echo "Uploading .zsync: $ZSYNC"
            gh release upload "${{ github.ref_name }}" "$ZSYNC" --clobber
          fi
          if [ -z "$APPIMAGE" ] && [ -z "$ZSYNC" ]; then
            echo "No AppImage or .zsync found, skipping"
          fi
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Release info ==="
          gh release view "${{ github.ref_name }}"
          echo "=== Assets ==="
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[] | "\(.name) \(.size/1048576|floor)MB"'
      # SignPath Foundation: auto-sign Windows exe (when configured)
      # See FIRMA_CODIGO.md and CODE_SIGNING_POLICY.md
      # Uncomment below after SignPath Foundation approval:
      # - name: Sign Windows exe with SignPath
      #   uses: SignPath/signpath-action@v1
      #   with:
      #     apiUrl: https://app.signpath.io
      #     artifactDropPath: artifacts/build-windows/
      #     signingPolicyId: <your-policy-id>
      #     waitForCompletion: true
