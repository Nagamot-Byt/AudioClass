name: CI

# #10 — Regresión automática ampliada (2026-08): compila todos los .py y
# ejecuta la suite de tests del núcleo mediante run_ci_suite.py, la ÚNICA
# fuente de verdad de la lista y de la ejecución (13 tests: UI smoke/v91,
# WCAG, privacidad, seguridad del servidor Colab, motor paralelo, exportación
# DOCX/PDF, E2E de UI headless, estrés, mejoras v10, idioma 'auto', watchdog y
# benchmark de modelos). Cada test es un paso nombrado que llama al driver en
# modo test único, y un guard de paridad falla si los pasos de aquí no
# coinciden exactamente con la lista del driver. desplegar_produccion.sh
# fase [1] consume la misma suite completa, así que CI y despliegue no pueden
# divergir. Se ejecuta en cada push y PR, y manualmente con workflow_dispatch.
#
# Modelos y fixtures (NO versionados en git):
#   * models/tiny.pt (75 MB) y los .pt de base no se versionan: el paso
#     "Descargar modelos" los baja a la caché de openai-whisper (~/.cache/whisper)
#     y copia tiny.pt a models/ para los tests que lo cargan del repo.
#   * Los tests con VOZ REAL (estrés, streaming de v10, benchmark) necesitan
#     prueba_voz_es.wav / tts_clase.wav y gen_clase_tts.py (el guion de
#     referencia del WER). Versiona esos fixtures (git add -f, ~4 MB) o esos
#     tests fallarán/saltarán con mensaje claro en el CI.

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compilar todos los .py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile (sintaxis de todos los fuentes)
        run: |
          python -m py_compile audioclass_v91.py audioclass_core.py \
            audioclass_colab_server_v91.py grabar_prueba.py \
            bench_models.py optimizar_mic.py run_ci_suite.py \
            test_*.py && echo COMPILE_OK
      # El import del núcleo necesita numpy/scipy/sounddevice: este job no
      # tiene el paso de dependencias del job de tests, asi que se instalan
      # aqui las minimas (antes el import fallaba siempre en el CI).
      - name: Dependencias para el import del núcleo
        run: pip install --quiet numpy scipy sounddevice
      - name: Import básico del núcleo (sin GUI)
        run: |
          python -c "import audioclass_core as c; print('CORE_IMPORT_OK', c.SAMPLE_RATE, c.OUTPUT_DIR)"

  tests:
    name: Suite completa de tests del fuente (run_ci_suite.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias mínimas
        run: |
          # torch (CPU) desde el indice de PyTorch; el resto desde PyPI.
          # (--extra-index-url para que numpy/scipy/etc. no se busquen en el
          # indice de torch, donde no existen.)
          pip install --quiet numpy scipy sounddevice matplotlib fpdf2 pypdf \
            requests customtkinter
          pip install --quiet openai-whisper
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          # faster-whisper (CTranslate2 int8): el backend que el motor
          # auto-elige en desarrollo; lo ejercitan test_mejoras_v10 y
          # test_benchmark_models (en CI descargan sus modelos CT2 de HF).
          pip install --quiet faster-whisper
      - name: Instalar dependencias de sistema (xvfb para GUI + PortAudio para sounddevice)
        run: |
          command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb >/dev/null 2>&1
          # sounddevice necesita PortAudio del sistema en Linux: el wheel NO lo
          # trae (en Windows si). Sin libportaudio2, `import sounddevice` falla
          # (el preflight de abajo lo detecta con mensaje claro).
          sudo apt-get install -y libportaudio2 libsndfile1 >/dev/null 2>&1 || true
      - name: Preflight (GUI + faster_whisper importables)
        run: |
          python - <<'EOF'
          import sys
          missing = []
          for m in ("tkinter", "customtkinter", "matplotlib", "pypdf", "faster_whisper", "sounddevice"):
              try:
                  __import__(m)
              except Exception as e:
                  missing.append(f"{m}: {e!r}")
          if missing:
              print("PREFLIGHT_FAIL")
              print(*missing, sep="\n")
              sys.exit(1)
          print("PREFLIGHT_OK")
          EOF
      - name: Descargar modelos whisper (tiny/base) a cache y models/tiny.pt
        run: |
          # openai-whisper descarga los .pt a ~/.cache/whisper la primera vez.
          # test_parallel_transcribe y test_stress cargan models/tiny.pt del
          # repo, asi que se copia desde la cache (sin versionar 75 MB). base.pt
          # alimenta la deteccion de modelos de test_benchmark_models.
          python - <<'EOF'
          import os, shutil, whisper
          for name in ("tiny", "base"):
              whisper.load_model(name)
          os.makedirs("models", exist_ok=True)
          shutil.copy(os.path.expanduser("~/.cache/whisper/tiny.pt"), "models/tiny.pt")
          print("MODELS_READY")
          EOF
      - name: Fixtures de voz (prueba_voz_es.wav / tts_clase.wav)
        run: |
          # Los tests con voz real usan estos nombres; si solo hay uno de los
          # dos (ambos son el mismo TTS de referencia) se usa como respaldo.
          if [ -f tts_clase.wav ] && [ ! -f prueba_voz_es.wav ]; then cp tts_clase.wav prueba_voz_es.wav; fi
          if [ -f prueba_voz_es.wav ] && [ ! -f tts_clase.wav ]; then cp prueba_voz_es.wav tts_clase.wav; fi
          ls -la prueba_voz_es.wav tts_clase.wav 2>/dev/null \
            || echo "AVISO: sin fixture de voz en el repo: test_stress fallara y el benchmark saltara"
      - name: "Guard: pasos de CI == suite de run_ci_suite.py"
        run: |
          # run_ci_suite.py es la fuente de verdad de la lista y de la
          # ejecución (patrón, timeout, xvfb). Este guard falla si algún paso
          # nombrado de abajo no existe en la suite, o si la suite añade un
          # test sin paso aquí — así la lista no puede volver a divergir.
          python - <<'EOF'
          import re, subprocess, sys
          txt = open(".github/workflows/ci.yml", encoding="utf-8").read()
          steps = sorted(set(re.findall(r"python -u run_ci_suite\.py (\w+)", txt)))
          listed = subprocess.run([sys.executable, "-u", "run_ci_suite.py", "--list"],
                                  capture_output=True, text=True,
                                  encoding="utf-8", errors="replace")
          suite = sorted(l.strip() for l in listed.stdout.splitlines() if l.strip())
          if steps == suite:
              print("CI_SUITE_PARITY_OK", len(suite))
          else:
              print("CI_SUITE_PARITY_FAIL")
              print("  en ci.yml:", steps)
              print("  en suite :", suite)
              sys.exit(1)
          EOF
      # ── Pasos nombrados por test ───────────────────────────────────────────
      # Cada paso ejecuta el driver en modo test único: la lógica (patrón de
      # éxito, timeout, xvfb automático para GUI) vive SOLO en run_ci_suite.py.
      # Se captura la salida y se exige CI_SUITE_OK explícitamente (el
      # pipeline | tail enmascara el exit code: bug histórico de exportación).
      - name: "Test UI smoke (test_ui_smoke)"
        run: |
          out=$(python -u run_ci_suite.py test_ui_smoke 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test UI v91 (test_ui_v91)"
        run: |
          out=$(python -u run_ci_suite.py test_ui_v91 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test contraste WCAG AA (test_wcag_contrast)"
        run: |
          out=$(python -u run_ci_suite.py test_wcag_contrast 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test privacidad/consentimiento (test_privacy_consent)"
        run: |
          out=$(python -u run_ci_suite.py test_privacy_consent 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test seguridad servidor Colab (test_colab_server_security)"
        run: |
          out=$(python -u run_ci_suite.py test_colab_server_security 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test motor paralelo (test_parallel_transcribe)"
        run: |
          out=$(python -u run_ci_suite.py test_parallel_transcribe 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test exportación DOCX/PDF (test_export_docx_pdf)"
        run: |
          out=$(python -u run_ci_suite.py test_export_docx_pdf 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test E2E de UI headless (test_e2e_ui)"
        run: |
          out=$(python -u run_ci_suite.py test_e2e_ui 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test estrés (test_stress_transcripcion)"
        run: |
          out=$(python -u run_ci_suite.py test_stress_transcripcion 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test mejoras v10 (test_mejoras_v10)"
        run: |
          out=$(python -u run_ci_suite.py test_mejoras_v10 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test idioma auto (test_lang_auto)"
        run: |
          out=$(python -u run_ci_suite.py test_lang_auto 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test watchdog anti-cuelgue (test_watchdog)"
        run: |
          out=$(python -u run_ci_suite.py test_watchdog 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
      - name: "Test benchmark de modelos (test_benchmark_models)"
        run: |
          out=$(python -u run_ci_suite.py test_benchmark_models 2>&1); echo "$out"; echo "$out" | grep -q CI_SUITE_OK
