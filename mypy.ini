[mypy]
# mypy configuration for AudioClass
# Known pre-existing warnings are ignored; new code should be type-safe

python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_no_return = False
warn_unused_configs = False

# Ignore missing stubs for external libraries
ignore_missing_imports = True

# Exclude test files and backup directories
exclude = backup_AudioClass.*|test_.*\.py

# Ignore errors in test files
[mypy-test_*]
ignore_errors = True

# Ignore errors in backup directories
[mypy-backup_AudioClass*]
ignore_errors = True

# Per-module ignores for pre-existing issues
[mypy-toast_ui.*]
ignore_errors = True

[mypy-config_manager.*]
ignore_errors = True

