apiVersion: v1
kind: Secret
metadata:
  name: audioclass-secrets
  namespace: audioclass
  labels:
    app.kubernetes.io/name: audioclass
    app.kubernetes.io/component: server
type: Opaque
data:
  # Valores en base64 - REEMPLAZAR con valores reales
  # echo -n "tu-api-key" | base64
  AUDIOCLASS_API_KEY: ""  # Opcional: autenticación del servidor
  GEMINI_API_KEY: ""      # Opcional: Google Gemini para análisis IA
  OPENAI_API_KEY: ""      # Opcional: OpenAI para análisis IA
