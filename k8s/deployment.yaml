apiVersion: apps/v1
kind: Deployment
metadata:
  name: audioclass-server
  namespace: audioclass
  labels:
    app.kubernetes.io/name: audioclass
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "9.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audioclass
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audioclass
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Anti-affinity: distribuir pods en diferentes nodos
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - audioclass
                topologyKey: kubernetes.io/hostname
      
      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
        - name: audioclass
          image: audioclass-server:latest
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          # Environment variables
          envFrom:
            - configMapRef:
                name: audioclass-config
            - secretRef:
                name: audioclass-secrets
                optional: true
          
          # Recursos
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          
          # Health checks
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Volumes
          volumeMounts:
            - name: data
              mountPath: /app/config
              subPath: config
            - name: data
              mountPath: /app/recordings
              subPath: recordings
          
          # Security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      
      # Volumes
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audioclass-data
      
      # Graceful shutdown
      terminationGracePeriodSeconds: 30
