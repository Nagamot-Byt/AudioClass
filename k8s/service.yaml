apiVersion: v1
kind: Service
metadata:
  name: audioclass-server
  namespace: audioclass
  labels:
    app.kubernetes.io/name: audioclass
    app.kubernetes.io/component: server
  annotations:
    # Prometheus scraping
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: audioclass
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
