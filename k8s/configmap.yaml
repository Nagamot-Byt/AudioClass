apiVersion: v1
kind: ConfigMap
metadata:
  name: audioclass-config
  namespace: audioclass
  labels:
    app.kubernetes.io/name: audioclass
    app.kubernetes.io/component: server
data:
  # Servidor
  AUDIOCLASS_HOST: "0.0.0.0"
  AUDIOCLASS_PORT: "8000"
  AUDIOCLASS_MAX_UPLOAD_MB: "200"
  AUDIOCLASS_RATE_LIMIT: "30"
  
  # Transcripción
  AUDIOCLASS_MODEL: "base"
  AUDIOCLASS_LANGUAGE: "auto"
  AUDIOCLASS_DEVICE: "cpu"
  
  # Logging
  LOG_LEVEL: "info"
  
  # Python
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
