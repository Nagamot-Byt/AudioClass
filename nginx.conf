# ============================================================
# AudioClass Transcription Server - Nginx Reverse Proxy
#
# Configuración de nginx para proxy reverso al servidor.
# Incluye: rate limiting, compresión, headers de seguridad.
#
# Uso:
#   docker-compose -f docker-compose.server.yml --profile proxy up -d
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Rate Limiting ──────────────────────────────────────
    # Límite: 10 requests/segundo por IP
    limit_req_zone $binary_remote_addr zone=audioclass:10m rate=10r/s;

    # ── Compresión ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Upstream ───────────────────────────────────────────
    upstream audioclass_backend {
        server audioclass:8000;
        keepalive 32;
    }

    # ── Servidor HTTP (redirige a HTTPS) ───────────────────
    server {
        listen 80;
        server_name _;

        # Health check sin rate limit
        location /health {
            proxy_pass http://audioclass_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirigir todo lo demás a HTTPS (si hay SSL)
        # Si no hay SSL, commentar estas líneas y descomentar el bloque HTTPS
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Sin SSL: proxy directo
        location / {
            limit_req zone=audioclass burst=20 nodelay;

            proxy_pass http://audioclass_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts para transcripciones largas
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Tamaño máximo de upload
            client_max_body_size 200M;
        }
    }

    # ── Servidor HTTPS (descomentar si hay SSL) ────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Headers de seguridad
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     location / {
    #         limit_req zone=audioclass burst=20 nodelay;
    #
    #         proxy_pass http://audioclass_backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #
